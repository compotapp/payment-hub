version: "3.8"

services:
  #Postgres
  postgres-account:
    image: "postgres:15.0"
    container_name: "postgres-account"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_pass
    volumes:
      - account-data:/var/lib/postgresql/data
    networks:
      - payment-hub

  postgres-transaction:
    image: "postgres:15.0"
    container_name: "postgres-transaction"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: transaction_user
      POSTGRES_PASSWORD: transaction_pass
    volumes:
      - transaction-data:/var/lib/postgresql/data
    networks:
      - payment-hub

  postgres-transaction-shard0:
    image: "postgres:15.0"
    container_name: "postgres-transaction-shard0"
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: transaction_user
      POSTGRES_PASSWORD: transaction_pass
    volumes:
      - transaction-shard0-data:/var/lib/postgresql/data
    networks:
      - payment-hub

  postgres-transaction-shard1:
    image: "postgres:15.0"
    container_name: "postgres-transaction-shard1"
    ports:
      - "15433:5432"
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: transaction_user
      POSTGRES_PASSWORD: transaction_pass
    volumes:
      - transaction-shard1-data:/var/lib/postgresql/data
    networks:
      - payment-hub

  postgres-analytics:
    image: "timescale/timescaledb:latest-pg15"
    container_name: "postgres-analytics"
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass
    volumes:
      - analytics-data:/var/lib/postgresql/data
    networks:
      - payment-hub

  postgres-orchestrator:
    image: "postgres:15"
    container_name: "postgres-orchestrator"
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: orchestrator_db
      POSTGRES_USER: orchestrator_user
      POSTGRES_PASSWORD: orchestrator_pass
    volumes:
      - orchestrator-data:/var/lib/postgresql/data
    networks:
      - payment-hub

  #Kafka
  kafka-1:
    container_name: server-1
    image: apache/kafka:3.9.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_CLUSTER_ID: payment-hub
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@server-1:9091,2@server-2:9091,3@server-3:9091
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9090,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://server-1:9090,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - payment-hub

  kafka-2:
    container_name: server-2
    image: apache/kafka:3.9.2
    ports:
      - "9094:9094"
    environment:
      KAFKA_CLUSTER_ID: payment-hub
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@server-1:9091,2@server-2:9091,3@server-3:9091
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9090,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://server-2:9090,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - payment-hub

  kafka-3:
    container_name: server-3
    image: apache/kafka:3.9.2
    ports:
      - "9096:9096"
    environment:
      KAFKA_CLUSTER_ID: payment-hub
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@server-1:9091,2@server-2:9091,3@server-3:9091
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9090,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://server-3:9090,EXTERNAL://localhost:9096
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - payment-hub

  #services
  saga-orchestrator:
    container_name: saga-orchestrator
    image: compotapp/hub-saga-orchestrator:1.0.0-SNAPSHOT
    ports:
      - "8084:8084"
      - "19091:9091"
    environment:
      - DB_URL=jdbc:postgresql://postgres-orchestrator:5432/orchestrator_db
      - KAFKA_BOOTSTRAP_SERVERS=server-1:9090,server-2:9090
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=saga-orchestrator
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    volumes:
      - ./observability/opentelemetry/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar
    depends_on:
      - postgres-orchestrator
    networks:
      - payment-hub

  transaction-service:
    container_name: transaction-service
    image: compotapp/hub-transaction-service:1.0.0-SNAPSHOT
    ports:
      - "8082:8082"
      - "9010:9010"
    environment:
      - DB_URL=jdbc:postgresql://postgres-transaction:5432/transaction_db
      - KAFKA_BOOTSTRAP_SERVERS=server-1:9090,server-2:9090
#      - grpc.client.account-service.address=static://account-service:19090
#      - grpc.client.account-service.negotiation-type=plaintext
      - grpc.client.saga-orchestrator.address=static://saga-orchestrator:9091
      - grpc.client.saga-orchestrator.negotiation-type=plaintext
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=transaction-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_PROPAGATORS=tracecontext,baggage
      - JAVA_TOOL_OPTIONS=-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9010 -Dcom.sun.management.jmxremote.rmi.port=9010 -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost
    volumes:
      - ./observability/opentelemetry/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar
    depends_on:
      - saga-orchestrator
      - postgres-transaction
      - kafka-1
      - kafka-2
      - kafka-3
      - notification-service
    networks:
      - payment-hub

  account-service:
    container_name: account-service
    image: compotapp/hub-account-service:1.0.0-SNAPSHOT
    ports:
      - "19090:9090"
    environment:
      - DB_URL=jdbc:postgresql://postgres-account:5432/account_db
      - KAFKA_BOOTSTRAP_SERVERS=server-1:9090,server-2:9090
    depends_on:
      - postgres-account
    networks:
      - payment-hub

  notification-service:
    container_name: notification-service
    image: compotapp/hub-notification-service:1.0.0-SNAPSHOT
    ports:
      - "9093:9093"
    networks:
      - payment-hub

  analytics-service:
    container_name: analytics-service
    image: compotapp/hub-analytics-service:1.0.0-SNAPSHOT
#    expose:
#      - "9090"
    environment:
      - DB_URL=jdbc:postgresql://postgres-analytics:5432/analytics_db
      - KAFKA_BOOTSTRAP_SERVERS=server-1:9090,server-2:9090
    depends_on:
      - postgres-analytics
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - payment-hub

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - payment-hub

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - payment-hub

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - payment-hub

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - ./observability/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - payment-hub

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - payment-hub

volumes:
  account-data:
    driver: local
  transaction-data:
    driver: local
  transaction-shard0-data:
    driver: local
  transaction-shard1-data:
    driver: local
  analytics-data:
    driver: local
  orchestrator-data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  kafka1_data:
    driver: local
  kafka2_data:
    driver: local
  kafka3_data:
    driver: local

networks:
  payment-hub:
    driver: bridge

# docker-compose -f docker/payment-hub/docker-compose.yaml up -d

